plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

// NeoGradle's run definitions are also consumed by IntelliJ's Gradle sync to
// create the *IdeBeforeRun tasks used by NeoForge launch configurations.
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('runs').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output',
                file('src/generated/resources').getAbsolutePath(), '--existing',
                file('src/main/resources').getAbsolutePath()
    }
}

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // The userdev artifact intentionally omits NeoForge's runtime-only config
    // helpers; keep the universal jar compile-only for the config spec API.
    compileOnly "net.neoforged:neoforge:${neo_version}:universal"

    // The full JEI jar supplies the public API and the isolated client mixin targets.
    compileOnly "mezz.jei:jei-26.1.2-neoforge:${jei_compile_version}"
    localRuntime "mezz.jei:jei-26.1.2-neoforge:${jei_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        neo_version_range: neo_version_range,
        jei_version: jei_version,
        jei_version_range: jei_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.register('testRecipeTreeMaterials', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + configurations.localRuntime
    mainClass = 'com.lingmu0.JeiPlusPlusMod.client.RecipeTreeOutputChoicesTest'
}
// Scene regression fixtures use JEI rectangle types from the legacy compile baseline.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath

tasks.register('testJeiInputBridge', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + configurations.localRuntime
    mainClass = 'com.lingmu0.JeiPlusPlusMod.client.JeiInputBridgeTest'
}
tasks.named('check') { dependsOn 'testRecipeTreeMaterials', 'testJeiInputBridge' }
apply from: 'gradle/verify-jei.gradle'
tasks.named('test') { enabled = false }
