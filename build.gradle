plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

repositories {
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_compile_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.toVersion(25)
    targetCompatibility = JavaVersion.toVersion(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.register('testFabricConfig', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lingmu0.JeiPlusPlusMod.FabricConfigSpecTest'
    workingDir = projectDir
}
// Regression checks are an ordinary Java process and do not bootstrap Minecraft.
tasks.named('test') { enabled = false }
apply from: 'gradle/verify-fabric.gradle'
tasks.register('testRecipeTreeMaterials', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lingmu0.JeiPlusPlusMod.client.RecipeTreeOutputChoicesTest'
}
tasks.register('testJeiInputBridge', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lingmu0.JeiPlusPlusMod.client.JeiInputBridgeTest'
}
tasks.named('check') { dependsOn 'testRecipeTreeMaterials', 'testJeiInputBridge' }
apply from: 'gradle/verify-jei.gradle'
